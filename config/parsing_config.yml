# Parsing ground-truth configuration. Every key is required; there are no Python defaults.

# The evaluator that scores parsing output: which repository, which commit, which conda env file builds it,
# and whether formula metrics (CDM) run. The commit is pinned to a full 40-character SHA.
# OmniDocBench publishes no git tags, so there is no v1.7 tag to resolve. The pin is the commit that first
# records the 30 April 2026 "Updated from v1.6 to v1.7" release note in the README (a 6 May 2026 commit).
# Formula metrics are refused in stage one: formulas arrive with stage three.
evaluator:
  repo: https://github.com/opendatalab/OmniDocBench.git
  commit: 50d69e3ea1dc1866f49e8b5369f4155dfdaca3ed
  conda_env_file: envs/omnidocbench.yml
  formula_metrics: false

# The OmniDocBench block-level category_type values a layout block may declare through parse_category.
category_vocabulary: [title, text_block, figure, figure_caption, figure_footnote, table, table_caption,
  table_footnote, equation_isolated, equation_caption, header, footer, page_number, page_footnote,
  abandon, code_txt, code_txt_caption, reference]

# Categories whose ground-truth blocks carry no text (they are located, never transcribed).
textless_categories: [figure, abandon]

# The default category of each DSL construct when a block declares no parse_category. primitives holds
# exactly the eight leaf primitives and the three containers; overlays holds exactly the registered
# overlay drawers; anchors holds the container anchor values. Each value is in category_vocabulary.
category_map:
  primitives: {text: text_block, pair: text_block, block: text_block, table: table, banner: title,
               logo: figure, barcode: figure, qrcode: figure, panel: text_block, split: text_block,
               stack: text_block}
  overlays: {stamp: text_block, handwriting: text_block, ink_marks: abandon, highlight: abandon}
  anchors: {foot: footer}

# The evaluator's ignored categories and the distance at which it matches a prediction to one, both read
# from src/core/matching/match_quick.py at the pinned commit (match_gt2pred_quick: the `ignores` list and
# `np.argwhere(ignore_matrix < 0.25)`). The evaluator matches the ground-truth lines of these categories
# first and drops every prediction whose normalised edit distance to one is below the threshold, so
# `validate` refuses a page where an ignored block's text lies below it from a scored block's text: a
# correct reading of the scored block would be dropped. The comparison is strict, as the evaluator's is.
# These are the evaluator's contract, not this corpus's vocabulary, so the list names categories (such as
# code_algorithm) that category_vocabulary does not.
ignored_categories: [figure_caption, figure_footnote, table_caption, table_footnote, code_algorithm,
  code_algorithm_caption, header, footer, page_footnote, page_number, equation_caption]
ignored_match_max_distance: 0.25

# The largest vertical displacement, in pixels, a fold may move a block before its ground truth is
# refused as no longer matching the page.
fold_displacement_max_px: 3

# The degradation tiers (names from receipt_degradation.tiers in config/generation_config.yml) whose
# pages are scored for layout. A test measures each listed tier's worst fold displacement on a page of
# fiducial dots (seeds 0 to 4, at the first probe receipt's 420 x 1029 size) and fails above
# fold_displacement_max_px. Measured on 13 October 2026: light 0.0 px, moderate 0.0 px, heavy 6.4 to
# 6.6 px (its fold is not reproducible under a fixed seed, so the value varies between runs). Heavy is
# therefore left out: its pages are still scored for text, tables and reading order, not for layout.
layout_scored_tiers: [light, moderate]

# The parsers scored. backend is the tool's own back-end selector (MinerU's -b value; default where the
# tool has one standard pipeline). runner is local, remote or builtin: a local tool is run on this machine
# by scripts/run_local_parser.py from the conda env its conda_env_file builds (the env's name: key names
# it); a remote tool, run elsewhere and its markdown copied back, gives null; a builtin tool is run by the
# same script in the generator's own env (it gives null, and device cpu). device is the accelerator the
# tool is told to use, as the tool spells it (mps is Apple silicon's GPU; MinerU's vlm-engine back-end runs
# through MLX on the same GPU whatever this says). Every parser here runs locally on Apple silicon.
# inputs is the page files the tool is scored on (png, pdf or both; the runner's --input picks one per
# run): a typeset set holds both, a stage-one half only the png. Marker is scored on images only, as stage
# one ran it. text_layer is the no-model baseline: a native PDF's own text layer, read with pypdfium2.
# credits is what the leaderboard's closing "Tools and licences" block prints for the tool: its project
# name and URL and the licences of its code and its model weights, read from the official sources on
# 14 October 2026 (PDF-Extract-Kit's on 15 October 2026). A weights licence not confirmed from an
# official source reads "see <URL>". Tools of one project (the two MinerU back-ends) carry the same
# credits and are listed once.
tools:
  - name: mineru_pipeline
    backend: pipeline
    runner: local
    device: mps
    conda_env_file: envs/mineru.yml
    inputs: [png, pdf]
    credits:
      project: MinerU
      url: https://github.com/opendatalab/MinerU
      code_licence: MinerU Open Source License (Apache-2.0 with additional terms), https://github.com/opendatalab/MinerU/blob/master/LICENSE.md
      weights_licence: MinerU2.5-Pro Apache-2.0 (https://huggingface.co/opendatalab/MinerU2.5-Pro-2605-1.2B); PDF-Extract-Kit-1.0 AGPL-3.0 (https://huggingface.co/opendatalab/PDF-Extract-Kit-1.0, https://github.com/opendatalab/PDF-Extract-Kit)
  - name: mineru_vlm
    backend: vlm-engine
    runner: local
    device: mps
    conda_env_file: envs/mineru.yml
    inputs: [png, pdf]
    credits:
      project: MinerU
      url: https://github.com/opendatalab/MinerU
      code_licence: MinerU Open Source License (Apache-2.0 with additional terms), https://github.com/opendatalab/MinerU/blob/master/LICENSE.md
      weights_licence: MinerU2.5-Pro Apache-2.0 (https://huggingface.co/opendatalab/MinerU2.5-Pro-2605-1.2B); PDF-Extract-Kit-1.0 AGPL-3.0 (https://huggingface.co/opendatalab/PDF-Extract-Kit-1.0, https://github.com/opendatalab/PDF-Extract-Kit)
  - name: docling
    backend: default
    runner: local
    device: mps
    conda_env_file: envs/docling.yml
    inputs: [png, pdf]
    credits:
      project: Docling
      url: https://github.com/docling-project/docling
      code_licence: MIT, https://github.com/docling-project/docling/blob/main/LICENSE
      weights_licence: layout Apache-2.0 (https://huggingface.co/docling-project/docling-layout-heron); TableFormer Apache-2.0 and CDLA-Permissive-2.0 (https://huggingface.co/docling-project/docling-models); OCR weights see https://github.com/RapidAI/RapidOCR
  - name: marker
    backend: default
    runner: local
    device: mps
    conda_env_file: envs/marker.yml
    inputs: [png]
    credits:
      project: Marker
      url: https://github.com/datalab-to/marker
      code_licence: Apache-2.0, https://github.com/datalab-to/marker/blob/master/LICENSE
      weights_licence: modified AI Pubs Open RAIL-M, https://github.com/datalab-to/surya/blob/master/MODEL_LICENSE
  - name: text_layer
    backend: default
    runner: builtin
    device: cpu
    conda_env_file: null
    inputs: [pdf]
    credits:
      project: pypdfium2
      url: https://github.com/pypdfium2-team/pypdfium2
      code_licence: BSD-3-Clause or Apache-2.0 (pypdfium2 and PDFium), https://github.com/pypdfium2-team/pypdfium2/tree/main/LICENSES
      weights_licence: none, no model is run (the PDF's own text layer), https://github.com/pypdfium2-team/pypdfium2
