# Parsing ground-truth configuration. Every key is required; there are no Python defaults.

# The evaluator that scores parsing output: which repository, which commit, which conda env file builds it,
# and whether formula metrics (CDM) run. The commit is pinned to a full 40-character SHA.
# OmniDocBench publishes no git tags, so there is no v1.7 tag to resolve. The pin is the commit that first
# records the 30 April 2026 "Updated from v1.6 to v1.7" release note in the README (a 6 May 2026 commit).
# Formula metrics are refused in stage one: formulas arrive with stage three.
evaluator:
  repo: https://github.com/opendatalab/OmniDocBench.git
  commit: 50d69e3ea1dc1866f49e8b5369f4155dfdaca3ed
  conda_env_file: envs/omnidocbench.yml
  formula_metrics: false

# The OmniDocBench block-level category_type values a layout block may declare through parse_category.
category_vocabulary: [title, text_block, figure, figure_caption, figure_footnote, table, table_caption,
  table_footnote, equation_isolated, equation_caption, header, footer, page_number, page_footnote,
  abandon, code_txt, code_txt_caption, reference]

# Categories whose ground-truth blocks carry no text (they are located, never transcribed).
textless_categories: [figure, abandon]

# The default category of each DSL construct when a block declares no parse_category. primitives holds
# exactly the eight leaf primitives and the three containers; overlays holds exactly the registered
# overlay drawers; anchors holds the container anchor values. Each value is in category_vocabulary.
category_map:
  primitives: {text: text_block, pair: text_block, block: text_block, table: table, banner: title,
               logo: figure, barcode: figure, qrcode: figure, panel: text_block, split: text_block,
               stack: text_block}
  overlays: {stamp: text_block, handwriting: text_block, ink_marks: abandon, highlight: abandon}
  anchors: {foot: footer}

# The largest vertical displacement, in pixels, a fold may move a block before its ground truth is
# refused as no longer matching the page.
fold_displacement_max_px: 3

# The degradation tiers (names from receipt_degradation.tiers in config/generation_config.yml) whose
# pages are scored for layout. Task 6's test decides whether heavy may stay in this list.
layout_scored_tiers: [light, moderate, heavy]

# The parsers scored. runner is local or remote: a local tool names the conda env file that builds it, a
# remote tool (run on the GPU server) gives null.
tools:
  - {name: mineru_pipeline, backend: pipeline, runner: remote, conda_env_file: null}
  - {name: mineru_vlm, backend: vlm-transformers, runner: remote, conda_env_file: null}
  - {name: docling, backend: default, runner: local, conda_env_file: envs/docling.yml}
  - {name: marker, backend: default, runner: local, conda_env_file: envs/marker.yml}
