# Invoice line items per service category (service_categories, below): an invoice's lines are drawn only
# from its own category's entry, and `pipeline validate` refuses an invoice layout whose categories lack
# one. Each entry is printed verbatim as LINE_ITEM_DESCRIPTIONS, so its wording is what the layout's design
# would print: a trade invoice splits labour from materials, a wholesale line carries its item code and
# pack size, and a subscription line is one plan per billing period or a count of seats. The seed draws one
# to four of a category's lines and prints them in the order drawn, every line equally likely to be billed
# and to be printed first, so no line leads every invoice of its category; catalogue order means nothing. `quantity` is the inclusive [min, max] a line may be billed in (1 for a
# plan or a one-off fee). Every key is required.
category_catalog:
  accounting:
    - {description: "Accounting and bookkeeping", unit: hrs, price_low: 80, price_high: 180,
       quantity: [1, 8]}
