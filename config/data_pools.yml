# Australian business content pools for synthetic document generation.
#
# `retailers` and `professional_services` are REAL businesses. They are never
# emitted into generated documents — content_engine.py reads only their
# `name` fields to seed the real-name blocklist that fictional_business()
# screens invented names against.

faker_config:
  locale: en_AU
  seed_base: 42

# The public ABN register: every ABN in the ABN Lookup Bulk Extract (data.gov.au,
# CC BY 3.0 AU), current and cancelled, as a sorted uint64 array with no names.
# generate_abn() redraws any checksum-valid ABN found in it, so an invented
# business never prints a real one. Too large to commit; build it on each
# machine that seeds ground truth with
#   python scripts/build_abn_register.py public_split_1_10.zip public_split_11_20.zip
# `~` is expanded.
abn_register:
  path: ~/data/abr/abn_registered.npy

