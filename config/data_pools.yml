    - "This amount will be debited from your nominated account on the due date. No action is required."
    - "Your direct debit is scheduled for the due date; please ensure funds are available."
    - "Payment is collected by direct debit under your service agreement."
    - "To change your nominated account, contact us before the debit date."
    - "A dishonour fee applies if a scheduled debit is declined."
  # The professional layout's terms of engagement, printed in full: several sentences each, as a firm
  # sets out its costs basis, disbursements and interest. Worded for conveyancing and patent work alike.
  engagement_terms:
    - >-
      Our fees are charged in accordance with the costs agreement signed at the start of this matter.
      Disbursements are passed on at cost. Accounts unpaid after 30 days may attract interest at the rate
      set out in that agreement.
    - >-
      This account is payable within 14 days. Where funds are held in trust for this matter, we may apply
      them to this account after 7 days unless you instruct us otherwise. Please quote the matter number
      with your payment.
    - >-
      Professional fees are calculated in six-minute units at the hourly rates in our letter of
      engagement. Official fees and searches are charged as incurred. If you have any question about this
      account, please contact the principal named above.
    - >-
      Payment is due within 30 days of the invoice date. Interest may be charged on overdue amounts at the
      rate allowed under our terms of engagement. You may ask us for an itemised account within 30 days of
      receiving this invoice.
    - >-
      Fees for work completed to date are billed monthly and are payable within 14 days. Disbursements
      paid on your behalf are shown separately. We may stop work on this matter while an account remains
      unpaid.
  thank_you:
    - "Thank you for your business."
    - "We appreciate your prompt payment."
    - "Thanks for choosing us, we look forward to working with you again."
    - "It was a pleasure to assist you."
    - "Your support of local business is appreciated."
  bank_promo:
    - "Ask us about a fixed rate home loan with no ongoing fees. Conditions apply."
    - "Switch your savings to earn bonus interest each month."
    - "Keep your details safe: we will never ask for your password by email."
    - "Set up automatic payments to avoid late fees."
    - "Review your travel insurance options before you book."
    - "Update your contact details in the app to receive alerts."
  margin_note: [WRE, "D5 car", "50% work", "home office", "work use", "100% business", "tools", "client lunch"]

# Which category_nouns categories feed receipts (retail) vs invoices (services).
# Semantic partition — not derivable from category_nouns keys alone.
# Each invoice layout declares which of the service categories its content may draw
# (config/layouts/invoices.yml -> <layout>.service_categories).
receipt_categories:
  [hardware, grocery, office, electronics, retail, pharmacy, liquor, fuel, automotive, cafe]
service_categories:
  [accounting, legal, it_services, consulting, marketing, plumbing, electrical, conveyancing,
   patent_attorneys, food_wholesale, cleaning_wholesale, cloud_software, security_monitoring]

# Invoice service category -> the industry whose distractor text (the keyed pools under
# distractor_text) its invoices print. Every service category is mapped; categories of one industry
# share its wording.
category_industries:
  accounting: financial_services
  legal: legal_services
  it_services: technology
  consulting: business_advisory
  marketing: creative_services
  plumbing: plumbing_gas
  electrical: electrical_trades
  conveyancing: legal_services
  patent_attorneys: intellectual_property
  food_wholesale: food_distribution
  cleaning_wholesale: cleaning_supply
  cloud_software: software_services
  security_monitoring: security_monitoring

