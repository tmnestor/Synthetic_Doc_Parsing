# EFTPOS terminal-slip constants for the receipt payment block. Every key is
# required; generators/payment_block.py fails fast on any omission.
payment_terminal:
  # Weighted method pool for receipts. POS-plausible only — deliberately
  # excludes BPAY / PayPal / Bank Transfer, which never print a terminal slip.
  receipt_method_weights:
    EFTPOS: 30
    Visa: 25
    Mastercard: 20
    AMEX: 5
    Cash: 0            # every receipt in this corpus is linked to a bank transaction
    Apple Pay: 5
    Google Pay: 3
  acquirers:
    - Tyro Payments EFTPOS
    - Westpac EFTPOS
    - CBA Smart EFTPOS
    - ANZ Worldline EFTPOS
    - Smartpay EFTPOS
    - NAB EFTPOS
  schemes:
    EFTPOS:
      display: eftpos
      aid: A0000003841001
      pan_digits: 16
      account_types: [SAV, CHQ]
    Visa:
      display: VISA CREDIT
      aid: A0000000031010
      pan_digits: 16
      account_types: [CR]
    Mastercard:
      display: MASTERCARD
      aid: A0000000041010
      pan_digits: 16
      account_types: [CR]
    AMEX:
      display: AMERICAN EXPRESS
      aid: A00000002501
      pan_digits: 15
      account_types: [CR]
    Visa Debit:
      display: VISA DEBIT
      aid: A0000000031010
      pan_digits: 16
      account_types: [CHQ, SAV]
    Mastercard Debit:
      display: MASTERCARD DEBIT
      aid: A0000000041010
      pan_digits: 16
      account_types: [CHQ, SAV]
  # A linked receipt's scheme is fixed by its bank row, not by the weighted pool.
  # Longest matching prefix wins. `validate` fails if a linked description matches none.
  bank_description_methods:
    MASTERCARD DEBIT: Mastercard Debit
    VISA DEBIT: Visa Debit
    EFTPOS: EFTPOS
  # A linked receipt's scheme is fixed; this decides how often that payment is
  # presented as a phone wallet over the same scheme. 'none' means plain card.
  wallet_presentation_weights:
    none: 90
    Apple Pay: 6
    Google Pay: 4
  wallets:
    Apple Pay: APPLE PAY
    Google Pay: GOOGLE PAY
  entry_modes:
    card: (c)
    wallet: (t)
  # The slip's fixed wording -- CUSTOMER COPY, CONTACTLESS, APPROVED 00, the
  # AID:/Card:/PSN:/Terminal ID:/Transaction Ref:/Purchase AUD labels, the
  # cash tendered/change labels and the retain-copy footer -- is NOT config.
  # It is page chrome, and it lives with the rest of the page's fixed text in
  # the `body:` tree of config/layouts/receipts.yml. This file holds only the
  # pools a receipt *samples* from; every value below varies document to
  # document and reaches the page through the `receipt_payment` field
  # provider (generators/layout_dsl/field_providers.py).
  #
  # Cash-tender arithmetic: tendered is the next note of this denomination
  # above the total, plus 0..(cash_extra_notes - 1) extra notes of the same
  # denomination -- see derive_payment's _cash_tender helper.
  cash_tender_step: 5
  cash_extra_notes: 3

# Deterministic POS values for receipts, derived from
# sha256("{case_id}:pos:{invoice_date}"). Hex slices 0-8 belong to this block;
# payment_terminal (above) consumes 10-40 of the same digest. Every key is
# required; generators/payment_block.py's load_pos_pools fails fast on any
# omission.
pos_terminal:
  staff_names:
    [Sarah, James, Emma, Liam, Olivia, Noah, Chloe, Jack,
     Mia, Ethan, Ava, Will, Sophie, Ben, Isla, Tom]
  hour_min: 8
  hour_span: 12          # 08:00-19:59
  register_min: 1
  register_span: 8       # 01-08
  receipt_number_prefix: "R-"
  receipt_number_digest_length: 6

banks:
  - {code: cba, name: Commonwealth Bank, bsb_prefix: "06", header_color: "#FFD700", header_bg: "#000000"}
  - {code: westpac, name: Westpac, bsb_prefix: "03", header_color: "#FFFFFF", header_bg: "#D5002B"}
  - {code: nab, name: National Australia Bank, bsb_prefix: "08", header_color: "#FFFFFF", header_bg: "#C8102E"}
  - {code: anz, name: ANZ, bsb_prefix: "01", header_color: "#FFFFFF", header_bg: "#003087"}

# A bank statement row's description, drawn by the direction its money moves
# (scripts/seed_ground_truth.py): a row is money out with probability debit_share,
# and is then described only from `debit` (purchases, bills, withdrawals, a
# transfer out), else only from `credit` (salary, a refund, a transfer in,
# a direct credit). Each kind carries its own amount range, rounded to its step
# (an ATM pays out in twenties). {merchant} and {biller} are an invented business
# name, upper-cased and cut to 12 characters as statements print them, which also
# keeps seed_transaction_links.py's _extract_suburb() (an ALL-CAPS merchant token
# before a Title-Case suburb) parsing EFTPOS descriptions correctly; {location} is
# the holder's suburb; {last4}, {crn}, {ref} and {mhf} are drawn reference numbers;
# {savings} is the holder's own savings account, the same on every row of a statement.
#
# direction_prefixes is how a printed description's direction is told, for these
# templates and for the descriptions scripts/seed_transaction_links.py writes on
# linked rows (EFTPOS, VISA DEBIT PURCHASE, BPAY, DIRECT DEBIT, EFT PAYMENT): money
# in when it starts with a credit prefix, money out when it starts with a debit
# prefix. The seed refuses, and `pipeline validate` refuses on every row of every
# statement, a row whose column contradicts its description (generators/bank_ledger.py).
bank_descriptions:
  debit_share: 0.80
  debit:
    eftpos: {template: "EFTPOS {merchant} {location} AUS", amount: [6.50, 240.00], step: 0.01}
    visa_debit: {template: "VISA DEBIT PURCHASE CARD {last4} {merchant} {location} AU", amount: [8.00, 320.00],
                 step: 0.01}
    mastercard_debit: {template: "MASTERCARD DEBIT {merchant} {location} AU", amount: [8.00, 320.00],
                       step: 0.01}
    bpay: {template: "BPAY {biller} CRN {crn}", amount: [45.00, 600.00], step: 0.01}
    direct_debit: {template: "DD {merchant} {ref} MHF {mhf}", amount: [15.00, 220.00], step: 0.01}
    transfer_out: {template: "TRANSFER TO SAVINGS {savings}", amount: [50.00, 600.00], step: 10.00}
    atm_withdrawal: {template: "ATM WITHDRAWAL {location}", amount: [20.00, 400.00], step: 20.00}
    online_purchase: {template: "ONLINE PURCHASE {merchant}", amount: [5.00, 200.00], step: 0.01}
  credit:
    salary: {template: "SALARY {biller}", amount: [1800.00, 4200.00], step: 0.01}
    refund: {template: "REFUND {merchant} {location} AU", amount: [6.00, 180.00], step: 0.01}
    transfer_in: {template: "TRANSFER FROM SAVINGS {savings}", amount: [100.00, 1200.00], step: 10.00}
    direct_credit: {template: "DIRECT CREDIT {biller} {ref}", amount: [30.00, 900.00], step: 0.01}
  direction_prefixes:
    debit: ["EFTPOS ", "VISA DEBIT ", "MASTERCARD DEBIT ", "BPAY ", "DD ", "DIRECT DEBIT ", "EFT PAYMENT ",
            "TRANSFER TO ", "ATM WITHDRAWAL ", "ONLINE PURCHASE "]
    credit: ["SALARY ", "REFUND ", "TRANSFER FROM ", "DIRECT CREDIT "]

# The running balance a statement prints (generators/bank_ledger.py). Every corpus
# statement is an everyday personal account, which does not run overdrawn: its
# running balance stays at or above the floor of its kind. The seed draws how far
# above the floor the statement's lowest balance sits from lowest_above_floor,
# then the opening balance that puts it there given the rows as the link seeder
# leaves them, so the floor holds by construction; it refuses a statement that
# breaks it, as `pipeline validate` does.
bank_balance:
  account_kind: personal
  floors: {personal: 0.00}
  lowest_above_floor: [150.00, 2500.00]

