# Extraction / evaluation contract for the 165-document benchmark.
#
# This defines the SHAPE OF THE EXTRACTION GROUND-TRUTH CSV produced by
# scripts/generate_extraction_gt.py, and the field set a model is scored against:
# which fields exist per document type, and how their values are formatted
# (monetary fields carry "$", booleans are lowercase true/false).
#
# ---------------------------------------------------------------------------
# DO NOT CONFUSE THIS WITH config/field_definitions.yml
# ---------------------------------------------------------------------------
# field_definitions.yml is the GENERATION contract: what the renderers draw on a
# page. It deliberately differs from this file:
#
#   * bank statements there also carry ACCOUNT_BALANCE, SUPPLIER_NAME, PAYER_NAME,
#     TRANSACTION_DESCRIPTIONS and TRANSACTION_AMOUNTS_RECEIVED — rendered on the
#     document, but NOT part of the 5-field extraction task;
#   * receipts there omit PAYER_NAME / PAYER_ADDRESS, because a receipt shows no
#     payer. They ARE in the extraction set below: the extraction prompt asks for
#     them, so the correct answer is NOT_FOUND and emitting a value is a
#     hallucination the evaluation must catch.
#
# The field lists below must match the prompt the model is given. They are the
# questions asked; the ground truth supplies the answers, and NOT_FOUND is a
# legitimate answer rather than a gap.
#
# Fields listed under evaluation.field_types but absent from every document_fields
# list (RECEIPT_TOTAL, BANK_TRANSACTION_DEBIT) are formatting declarations for
# other pipelines; they add no CSV columns here.

document_fields:
  invoice:
    count: 14
    fields:
      - DOCUMENT_TYPE
      - BUSINESS_ABN
      - SUPPLIER_NAME
      - BUSINESS_ADDRESS
      - PAYER_NAME
      - PAYER_ADDRESS
      - INVOICE_DATE
      - LINE_ITEM_DESCRIPTIONS
      - LINE_ITEM_QUANTITIES
      - LINE_ITEM_PRICES
      - LINE_ITEM_TOTAL_PRICES
      - IS_GST_INCLUDED
      - GST_AMOUNT
      - TOTAL_AMOUNT

  # Identical to invoice by design: the two prompts ask for the same 14 fields,
  # which is why a receipt misclassified as an invoice is still asked the right
  # questions and loses only DOCUMENT_TYPE.
  receipt:
    count: 14
    fields:
      - DOCUMENT_TYPE
      - BUSINESS_ABN
      - SUPPLIER_NAME
      - BUSINESS_ADDRESS
      - PAYER_NAME
      - PAYER_ADDRESS
      - INVOICE_DATE
      - LINE_ITEM_DESCRIPTIONS
      - LINE_ITEM_QUANTITIES
      - LINE_ITEM_PRICES
      - LINE_ITEM_TOTAL_PRICES
      - IS_GST_INCLUDED
      - GST_AMOUNT
      - TOTAL_AMOUNT

  bank_statement:
    count: 5
    fields:
      - DOCUMENT_TYPE
      - STATEMENT_DATE_RANGE
      - LINE_ITEM_DESCRIPTIONS
      - TRANSACTION_DATES
      - TRANSACTION_AMOUNTS_PAID

evaluation:
  field_types:
    monetary:
      - GST_AMOUNT
      - TOTAL_AMOUNT
      - LINE_ITEM_PRICES
      - LINE_ITEM_TOTAL_PRICES
      - TRANSACTION_AMOUNTS_PAID
      - TRANSACTION_AMOUNTS_RECEIVED
      - ACCOUNT_BALANCE
      - RECEIPT_TOTAL
      - BANK_TRANSACTION_DEBIT

    boolean:
      - IS_GST_INCLUDED

# One sentence per extraction field, printed in each snapshot's README for a
# reader with no access to this repository. Every field named under
# document_fields needs exactly one entry, and every entry must name such a
# field; the snapshot export refuses otherwise. The CSV projection ignores it.
field_descriptions:
  DOCUMENT_TYPE: "The kind of document shown: INVOICE, RECEIPT or BANK_STATEMENT."
  BUSINESS_ABN: "The supplier's 11-digit Australian Business Number, written in the 2-3-3-3 grouping."
  SUPPLIER_NAME: "The trading name of the business that issued the invoice or receipt."
  BUSINESS_ADDRESS: "The supplier's street address as printed on the document."
  PAYER_NAME: "The customer billed by an invoice, or NOT_FOUND on a receipt, which names no payer."
  PAYER_ADDRESS: "The billed customer's address, or NOT_FOUND where the document shows none."
  INVOICE_DATE: "The date the invoice or receipt was issued, as DD/MM/YYYY."
  LINE_ITEM_DESCRIPTIONS: "The description of each purchased item, or of each debit transaction on a statement, in printed order, separated by ' | '."
  LINE_ITEM_QUANTITIES: "The quantity of each line item, in the same order as the descriptions."
  LINE_ITEM_PRICES: "The unit price of each line item, in the same order, each with a leading '$'."
  LINE_ITEM_TOTAL_PRICES: "The extended price of each line item (quantity times unit price), each with a leading '$'."
  IS_GST_INCLUDED: "Whether the total includes GST, as lowercase true or false."
  GST_AMOUNT: "The GST charged, with a leading '$'; where prices include GST it is one eleventh of the total."
  TOTAL_AMOUNT: "The total amount payable or paid, including GST, with a leading '$'."
  STATEMENT_DATE_RANGE: "The period a bank statement covers, as DD/MM/YYYY - DD/MM/YYYY."
  TRANSACTION_DATES: "The date of each debit transaction on the statement, as DD/MM/YYYY, separated by ' | '."
  TRANSACTION_AMOUNTS_PAID: "The amount of each debit transaction, in the same order as the dates, each with a leading '$'."
