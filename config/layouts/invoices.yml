# --- tax_invoice_wholesale -----------------------------------------------------
# A supplier's invoice for goods: a letterhead band with a chevron logo, the seller's
# warehouse and remittance addresses under its own, the title with the invoice
# number, customer account, purchase order and delivery docket number
# right-aligned opposite, the delivery address under "Ship To:" beside Bill To,
# the dispatch date, the sales representative, item-coded lines with their pack
# sizes, and the conditions of sale. Liberation Sans, dark grey.

# The letterhead band in the wholesaler's dark grey: logo and tagline left, the
# phone numbers and email right.
_wholesale_letterhead: &wholesale_letterhead
  type: split
  widths: [850, 850]
  children:
    - - {type: logo, content: "{SUPPLIER_NAME}", style: chevron, size: 120, min_text_size: 24,
         text_color: white, inset: 18, color: "#333333", align: left, when: DX_TAGLINE}
      - {type: spacer, height: 12, when: DX_TAGLINE}
      - {type: text, content: "{DX_TAGLINE}", color: "#333333", bold: true, budget: DISTRACTOR_HALF,
         line_advance: 39, when: DX_TAGLINE}
      - {type: spacer, height: 24, when: DX_TAGLINE}
    - - {type: text, content: "Phone: {DX_PHONE}", align: right, budget: DISTRACTOR_HALF,
         line_advance: 39, when: DX_PHONE}
      - {type: text, content: "Mobile: {DX_MOBILE}", align: right, budget: DISTRACTOR_HALF,
         line_advance: 39, when: DX_MOBILE}
      - {type: text, content: "Freecall: {DX_FREECALL}", align: right, budget: DISTRACTOR_HALF,
         line_advance: 39, when: DX_FREECALL}
      - {type: text, content: "Email: {DX_EMAIL}", align: right, budget: DISTRACTOR_HALF,
         line_advance: 39, when: DX_EMAIL}
      - {type: spacer, height: 24, when: DX_EMAIL}

_wholesale_seller: &wholesale_seller
  type: split
  widths: [1100, 600]
  children:
    - - {type: text, content: "{SUPPLIER_NAME}", bold: true, budget: SUPPLIER_NAME, field: SUPPLIER_NAME,
         line_advance: 44}
      - *invoice_seller_address
      - {type: text, content: "Warehouse: {DX_BRANCH_ADDRESS}", budget: DISTRACTOR_WIDE,
         line_advance: 40, when: DX_BRANCH_ADDRESS}
      - {type: text, content: "Remittance address: {DX_REMIT_PO_BOX}", budget: DISTRACTOR_WIDE,
         line_advance: 40, when: DX_REMIT_PO_BOX}
      - {type: text, content: "{LABEL_BUSINESS_ABN}{BUSINESS_ABN}", budget: ABN_LINE, field: BUSINESS_ABN,
         line_advance: 40}
      - {type: text, content: "ACN: {DX_ACN}", budget: DISTRACTOR_WIDE, line_advance: 40, when: DX_ACN}
      - {type: text, content: "{DX_ACCREDITATION}", color: gray, budget: DISTRACTOR_WIDE, line_advance: 40,
         when: DX_ACCREDITATION}
    - - {type: text, content: "TAX INVOICE", role: header, bold: true, align: right, color: "#333333",
         line_advance: 72, parse_category: title}
      - {type: text, content: "Invoice No: {DX_INVOICE_NUMBER}", align: right, bold: true,
         budget: DISTRACTOR_META, line_advance: 40, when: DX_INVOICE_NUMBER}
      - {type: text, content: "Customer account: {DX_CUSTOMER_NUMBER}", align: right,
         budget: DISTRACTOR_META, line_advance: 40, when: DX_CUSTOMER_NUMBER}
      - {type: text, content: "Purchase order: {DX_PO_NUMBER}", align: right,
         budget: DISTRACTOR_META, line_advance: 40, when: DX_PO_NUMBER}
      - {type: text, content: "Delivery docket: {DX_DELIVERY_DOCKET}", align: right,
         budget: DISTRACTOR_META, line_advance: 40, when: DX_DELIVERY_DOCKET}

_wholesale_rule: &wholesale_rule {type: rule, color: "#333333", thickness: 3, pad_above: 12, pad_below: 20}

# Bill To with the delivery address (a near-miss for PAYER_ADDRESS) under its
# own "Ship To:" heading opposite.
_wholesale_parties: &wholesale_parties
  type: split
  widths: [850, 850]
  children:
    - - *invoice_bill_to
      - *invoice_payer_name
      - *invoice_payer_address
    - *invoice_ship_to_column

_wholesale_dates: &wholesale_dates
  type: split
  widths: [566, 567, 567]
  children:
    - - *invoice_date
    - - {type: text, content: "Due date: {DX_DUE_DATE}", budget: DISTRACTOR_THIRD,
         line_advance: 52, when: DX_DUE_DATE}
    - - {type: text, content: "Dispatched: {DX_SUPPLY_DATE}", budget: DISTRACTOR_THIRD,
         line_advance: 52, when: DX_SUPPLY_DATE}

_wholesale_rep: &wholesale_rep
  {type: text, content: "Sales representative: {DX_CONTACT_PERSON}", budget: DISTRACTOR_HALF,
   line_advance: 52, when: DX_CONTACT_PERSON}

_wholesale_line_items: &wholesale_line_items
  <<: *invoice_line_items
  columns:
    - {key: description, label: "Item and description", align: left, x: 0,
       budget: LINE_ITEM_DESC, field: LINE_ITEM_DESCRIPTIONS}
    - {key: quantity, label: "Qty", align: left, x: 900, field: LINE_ITEM_QUANTITIES}
    - {key: price, label: "Unit Price", align: right, x: 1250,
       label_x: 1050, label_align: left, field: LINE_ITEM_PRICES}
    - {key: total, label: "Amount", align: right, x_right: 0,
       label_x: 1550, label_align: left, field: LINE_ITEM_TOTAL_PRICES}

_wholesale_totals: &wholesale_totals
  type: split
  widths: [1300, 400]
  children:
    - *invoice_payment_details
    - *industry_totals_column

# The range carried and this month's special (its price a near-miss for
# LINE_ITEM_PRICES under its own label), then the conditions of sale.
_wholesale_offers: &wholesale_offers
  type: split
  widths: [1100, 580]
  gap: 20
  children:
    - - {type: spacer, height: 24, when: DX_SERVICES}
      - {type: text, content: "We supply: {DX_SERVICES}", budget: DISTRACTOR_WIDE, line_advance: 39,
         when: DX_SERVICES}
    - - {type: spacer, height: 24, when: DX_PROMO_PRICE}
      - {type: text, content: "This month's specials from ${DX_PROMO_PRICE}", bold: true,
         color: "#333333", budget: DISTRACTOR_META, line_advance: 39, when: DX_PROMO_PRICE}

_wholesale_terms: &wholesale_terms
  type: stack
  children:
    - {type: spacer, height: 24, when: DX_TERMS}
    - {type: text, content: "Conditions of sale", bold: true, line_advance: 40, when: DX_TERMS}
    - *invoice_terms_text
    - *invoice_late_fee

_wholesale_items: &wholesale_items
  - in_invoice_number
  - in_po_number
  - in_customer_number
  - in_delivery_docket
  - in_acn
  - in_accreditation
  - in_tagline
  - in_phone
  - in_mobile
  - in_freecall
  - in_email
  - in_website
  - in_social
  - in_ship_to
  - in_remit_po_box
  - in_branch_address
  - in_due_date
  - in_supply_date
  - in_services
  - in_promo_price
  - in_contact_person
  - in_amount_paid
  - in_balance_due
  - in_paid_stamp
  - in_paid_date
  - in_account_summary
  - in_previous_balance
  - in_bank_account
  - in_bpay
  - in_payid
  - in_surcharge_note
  - in_terms
  - in_late_fee
  - in_remittance_total
  - in_thank_you
  - in_remit_barcode
  - in_page_number

# --- tax_invoice_subscription --------------------------------------------------
# A recurring bill: a round logo, the name, tagline, address and ABN at the top
# left with the support line and email beneath, the title, invoice number and
# account number opposite; a teal rule; Bill To beside the invoice date, the
# billing period and the due date (both near-misses for INVOICE_DATE, each under
# its own label); the plan lines charged this period;
# the totals beside the direct-debit notice and the other ways to pay; an
# upgrade offer; and the account terms. Carlito, teal.
_subscription_header: &subscription_header
  type: split
  widths: [1100, 600]
  children:
    - - {type: logo, content: "{SUPPLIER_NAME}", style: circle, size: 100, min_text_size: 20,
         text_color: white, inset: 14, color: "#0F766E", align: left, when: DX_TAGLINE}
      - {type: spacer, height: 12, when: DX_TAGLINE}
      - {type: text, content: "{SUPPLIER_NAME}", role: header, bold: true, color: "#0F766E",
         budget: SUPPLIER_NAME, field: SUPPLIER_NAME, line_advance: 64}
      - {type: text, content: "{DX_TAGLINE}", color: gray, budget: DISTRACTOR_WIDE, line_advance: 40,
         when: DX_TAGLINE}
      - *invoice_seller_address
      - {type: text, content: "{LABEL_BUSINESS_ABN}{BUSINESS_ABN}", budget: ABN_LINE, field: BUSINESS_ABN,
         line_advance: 40}
      - {type: text, content: "ACN: {DX_ACN}", budget: DISTRACTOR_WIDE, line_advance: 40, when: DX_ACN}
      - {type: text, content: "Support: {DX_FREECALL}", budget: DISTRACTOR_WIDE, line_advance: 40,
         when: DX_FREECALL}
      - {type: text, content: "Email: {DX_EMAIL}", budget: DISTRACTOR_WIDE, line_advance: 40,
         when: DX_EMAIL}
    - - {type: text, content: "TAX INVOICE", role: header, bold: true, align: right,
         line_advance: 72, parse_category: title}
      - {type: text, content: "Invoice No: {DX_INVOICE_NUMBER}", align: right, bold: true,
         budget: DISTRACTOR_META, line_advance: 40, when: DX_INVOICE_NUMBER}
      - {type: text, content: "Account No: {DX_CUSTOMER_NUMBER}", align: right,
         budget: DISTRACTOR_META, line_advance: 40, when: DX_CUSTOMER_NUMBER}
      - {type: text, content: "{DX_ACCREDITATION}", align: right, color: gray,
         budget: DISTRACTOR_META, line_advance: 40, when: DX_ACCREDITATION}

_subscription_rule: &subscription_rule
  {type: rule, color: "#0F766E", thickness: 4, pad_above: 16, pad_below: 24}

_subscription_parties: &subscription_parties
  type: split
  widths: [850, 850]
  children:
    - - *invoice_bill_to
      - *invoice_payer_name
      - *invoice_payer_address
    - - {type: pair, label: "Date", value: "{INVOICE_DATE}", field: INVOICE_DATE, line_advance: 44}
      - {type: text, content: "Billing period: {DX_BILLING_PERIOD}", budget: DISTRACTOR_HALF,
         line_advance: 44, when: DX_BILLING_PERIOD}
      - {type: text, content: "Due date: {DX_DUE_DATE}", bold: true, budget: DISTRACTOR_HALF,
         line_advance: 44, when: DX_DUE_DATE}

_subscription_heading: &subscription_heading
  {type: text, content: "Charges this period", bold: true, color: "#0F766E", line_advance: 52}

_subscription_line_items: &subscription_line_items
  <<: *invoice_line_items
  columns:
    - {key: description, label: "Plan or item", align: left, x: 0,
       budget: LINE_ITEM_DESC, field: LINE_ITEM_DESCRIPTIONS}
    - {key: quantity, label: "Qty", align: left, x: 900, field: LINE_ITEM_QUANTITIES}
    - {key: price, label: "Price", align: right, x: 1250,
       label_x: 1050, label_align: left, field: LINE_ITEM_PRICES}
    - {key: total, label: "Amount", align: right, x_right: 0,
       label_x: 1550, label_align: left, field: LINE_ITEM_TOTAL_PRICES}

# The direct-debit notice (worded for the payment state) heads the ways to pay,
# beside the totals; the supplier's bank line says "Bank account", apart from the
# customer's "Account No" in the header.
_subscription_totals: &subscription_totals
  type: split
  widths: [1300, 400]
  children:
    - - {type: text, content: "Payment: {DX_DIRECT_DEBIT}", bold: true, color: "#0F766E",
         budget: DISTRACTOR_HALF, line_advance: 40, when: DX_DIRECT_DEBIT}
      - {type: spacer, height: 12, when: DX_DIRECT_DEBIT}
      - {type: text, content: "Direct deposit BSB: {DX_BSB}", budget: DISTRACTOR_HALF,
         line_advance: 40, when: DX_BSB}
      - {type: text, content: "Bank account: {DX_ACCOUNT_NUMBER}", budget: DISTRACTOR_HALF,
         line_advance: 40, when: DX_ACCOUNT_NUMBER}
      - {type: text, content: "BPAY Biller Code: {DX_BPAY_BILLER}", budget: DISTRACTOR_HALF,
         line_advance: 40, when: DX_BPAY_BILLER}
      - {type: text, content: "BPAY Reference: {DX_BPAY_REFERENCE}", budget: DISTRACTOR_HALF,
         line_advance: 40, when: DX_BPAY_REFERENCE}
      - {type: text, content: "PayID: {DX_PAYID}", budget: DISTRACTOR_HALF, line_advance: 40,
         when: DX_PAYID}
      - {type: text, content: "{DX_SURCHARGE_NOTE}", color: gray, budget: DISTRACTOR_HALF,
         line_advance: 40, when: DX_SURCHARGE_NOTE}
    - *industry_totals_column

# The upgrade offer (its price a near-miss for LINE_ITEM_PRICES under its own
# label, priced above every unit price billed), what else the business sells, and the account terms.
_subscription_extras: &subscription_extras
  type: stack
  children:
    - {type: spacer, height: 24, when: DX_UPGRADE_PRICE}
    - type: panel
      padding: 16
      border_color: "#0F766E"
      when: DX_UPGRADE_PRICE
      children:
        - {type: text, content: "Upgrade offer: move to our premium plan from ${DX_UPGRADE_PRICE} a month",
           bold: true, color: "#0F766E", budget: DISTRACTOR_WIDE, line_advance: 39, when: DX_UPGRADE_PRICE}
    - {type: spacer, height: 16, when: DX_SERVICES}
    - {type: text, content: "Also available: {DX_SERVICES}", budget: DISTRACTOR_PARAGRAPH, line_advance: 39,
       when: DX_SERVICES}
    - {type: spacer, height: 16, when: DX_TERMS}
    - {type: text, content: "Account terms", bold: true, line_advance: 40, when: DX_TERMS}
    - *invoice_terms_text
    - *invoice_late_fee

_subscription_items: &subscription_items
  - in_invoice_number
  - in_customer_number
  - in_billing_period
  - in_direct_debit
  - in_acn
  - in_accreditation
  - in_tagline
  - in_freecall
  - in_email
  - in_website
  - in_social
  - in_due_date
  - in_services
  - in_upgrade_price
  - in_amount_paid
  - in_balance_due
  - in_paid_stamp
  - in_paid_date
  - in_account_summary
  - in_previous_balance
