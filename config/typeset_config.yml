# Stage two typesetting: how each layout is compiled to a native PDF by Typst and rasterised. Loaded and
# validated at startup by generators/typst/config.py; every key is required and there are no Python defaults.

# The Typst release PDFs are compiled with. Its output is version-dependent, so this must equal the exact
# version pinned in environment.yml and reported by `typst --version`; a mismatch is refused at startup.
typst_version: "0.15.1"

# Directory (relative to the repository root) of the .ttf files Typst may use. Typst is run with system
# fonts ignored, so the rendered glyphs come from here alone.
font_dir: fonts

# Seconds since the Unix epoch stamped on every PDF as its creation date, so a rebuild is byte-identical.
# 1767225600 is 1 January 2026, 00.00 UTC.
creation_timestamp: 1767225600

# Dots per inch of stage one's sheet canvases (invoices and bank statements are drawn on canvases exactly
# A4 high at this resolution, 3508 px, and narrower than A4). Their pixels convert to points at this
# resolution, so each font and gap keeps its stage-one physical size; the canvas is centred across the A4
# width. Receipts instead scale their pixel width to the roll width, since their height follows content.
canvas_dpi: 300

# Dots per inch at which a PDF page is rasterised to an image.
raster_dpi: 300

# The Typst template (relative to the repository root) every layout is typeset with.
template: generators/typst/template.typ

# How many processes `python -m generators.pipeline validate` typesets pages in at once in its typeset pass
# (every case, plain and with distractors). Pages are independent, so this changes only how long the pass
# takes, never its result or the order its failures are reported in. 6 suits a 10-core machine and leaves
# headroom; 1 typesets serially.
validate_workers: 6
